name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Linter Check (Oxlint)
        run: |
          cd frontend
          npx oxlint

      - name: Unit & Integration Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build Check (Vite)
        run: |
          cd frontend
          npm run build

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: E2E Tests (Playwright)
        run: |
          cd frontend
          npx playwright test

  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kisan
          POSTGRES_PASSWORD: kisanpassword
          POSTGRES_DB: kisanqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Linter Check (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Pytest
        env:
          DATABASE_URL: "postgresql+psycopg://kisan:kisanpassword@localhost:5432/kisanqueue_test"
          JWT_SECRET_KEY: "mock_secret_key_for_testing_only_long_enough"
          QR_HMAC_SECRET: "mock_hmac_secret_for_testing_only_long_enough"
          OTP_MOCK_ENABLED: "True"
        run: |
          cd backend
          alembic upgrade head
          python seed.py
          pytest tests/
