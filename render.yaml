services:
  - type: web
    name: kisanqueue-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: OTP_MOCK_ENABLED
        value: "true"
      - key: OTP_MOCK_CODE
        value: "1234"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://kisanqueue.vercel.app"
